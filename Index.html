<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bell Global Fitness — Build Strength. Eat Smart. Live Better.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Healthy eating, fitness and bodybuilding guidance for real, sustainable results." />
  <style>
    /* ——— GLOBAL THEME ——— */
    :root {
      --bg: #05060a;
      --bg-alt: #0d1018;
      --accent: #1e90ff;
      --accent-soft: #163b63;
      --danger: #ff3b3b;
      --text: #f5f5f5;
      --muted: #a0a4b8;
      --card: #11141f;
      --radius: 10px;
      --max-width: 1100px;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020308 55%, #000 100%);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ——— NAVIGATION ——— */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: linear-gradient(to bottom, rgba(5, 6, 10, 0.95), rgba(5, 6, 10, 0.7));
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .nav {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .logo-mark {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: conic-gradient(from 210deg, #1e90ff, #ff3b3b, #1e90ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      box-shadow: 0 0 18px rgba(30, 144, 255, 0.7);
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;
      font-size: 0.9rem;
    }

    .nav-links a {
      color: var(--muted);
      position: relative;
      padding-bottom: 0.1rem;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -0.2rem;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--danger));
      transition: width 0.2s ease-out;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      color: white;
      border-radius: 999px;
      padding: 0.55rem 1.2rem;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.45);
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
      white-space: nowrap;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.6);
    }

    .btn-outline {
      border-radius: 999px;
      padding: 0.55rem 1.2rem;
      font-size: 0.85rem;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s ease-out, color 0.15s ease-out, border-color 0.15s ease-out;
      white-space: nowrap;
    }

    .btn-outline:hover {
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border-color: rgba(148, 163, 184, 0.9);
    }

    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    /* ——— HERO ——— */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.1fr);
      gap: 2.5rem;
      align-items: center;
      padding: 2.5rem 0 2rem;
    }

    .hero-kicker {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .hero-title {
      font-size: clamp(2.2rem, 4vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 0.75rem;
    }

    .hero-title span {
      background: linear-gradient(120deg, #60a5fa, #22c55e, #f97316);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero-subtitle {
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 32rem;
      margin-bottom: 1.4rem;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.4rem;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hero-meta span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .hero-meta-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
    }

    .hero-card {
      background: radial-gradient(circle at top left, #1e293b 0, #020617 55%);
      border-radius: 18px;
      padding: 1.4rem 1.4rem 1.2rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(148, 163, 184, 0.25);
      position: relative;
      overflow: hidden;
    }

    .hero-card-tag {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.9);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .hero-card-main {
      display: flex;
      gap: 1.1rem;
      align-items: center;
      margin-bottom: 1.1rem;
    }

    .hero-avatar {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: radial-gradient(circle at 30% 0, #22c55e 0, #0f172a 45%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.4rem;
      color: #e5e7eb;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 16px 35px rgba(15, 23, 42, 0.9);
    }

    .hero-card-text h2 {
      font-size: 1rem;
      margin-bottom: 0.15rem;
    }

    .hero-card-text p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      font-size: 0.8rem;
    }

    .hero-stat {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      padding: 0.6rem 0.7rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .hero-stat-label {
      color: var(--muted);
      font-size: 0.7rem;
      margin-bottom: 0.15rem;
    }

    .hero-stat-value {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .hero-stat-pill {
      font-size: 0.7rem;
      margin-top: 0.15rem;
      color: #bbf7d0;
    }

    /* ——— SECTIONS ——— */
    section {
      margin-top: 3rem;
    }

    .section-kicker {
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .section-subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      max-width: 26rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.2rem;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.85);
    }

    .card h3 {
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }

    .card p {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: var(--muted);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    ul {
      list-style: none;
      padding-left: 0;
      margin: 0.4rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    ul li {
      margin-bottom: 0.25rem;
      display: flex;
      gap: 0.4rem;
    }

    ul li::before {
      content: "•";
      color: var(--accent);
      margin-top: 0.05rem;
    }

    /* ——— BLOG ——— */
    .blog-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .blog-item h3 {
      font-size: 0.98rem;
      margin-bottom: 0.25rem;
    }

    .blog-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .blog-item p {
      font-size: 0.86rem;
      color: var(--muted);
    }

    /* ——— CONTACT ——— */
    .contact-wrapper {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 1.5rem;
    }

    form {
      display: grid;
      gap: 0.75rem;
    }

    label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.15rem;
      display: block;
    }

    input,
    textarea {
      width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      padding: 0.55rem 0.6rem;
      font-size: 0.85rem;
      outline: none;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.5);
    }

    textarea {
      min-height: 120px;
    }

    .contact-card {
      background: radial-gradient(circle at top, #1e293b 0, #020617 60%);
      border-radius: 16px;
      padding: 1rem;
      border: 1px solid rgba(148, 163, 184, 0.3);
      font-size: 0.86rem;
      color: var(--muted);
    }

    .contact-card h3 {
      font-size: 1rem;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    .contact-card p + p {
      margin-top: 0.4rem;
    }

    .contact-links {
      margin-top: 0.6rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.82rem;
    }

    .contact-links a {
      color: var(--accent);
    }

    footer {
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      margin-top: 3rem;
      padding-top: 1.2rem;
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    footer span strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ——— RESPONSIVE ——— */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: minmax(0, 1fr);
      }
      .hero-card {
        order: -1;
      }
      .grid-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .contact-wrapper {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 700px) {
      .nav-links {
        display: none;
      }
      .hero {
        padding-top: 1.8rem;
      }
      .grid-3,
      .grid-2,
      .blog-list {
        grid-template-columns: minmax(0, 1fr);
      }
      main {
